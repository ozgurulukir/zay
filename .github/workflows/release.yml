name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: nova-linux-x86_64
            bin: nova
            target: x86_64-linux-musl
            zig_url: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            zig_ext: .tar.xz
            zig_dir: zig-x86_64-linux-0.16.0
          - os: windows-latest
            artifact: nova-windows-x86_64.exe
            bin: nova.exe
            target: x86_64-windows
            zig_url: https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip
            zig_ext: .zip
            zig_dir: zig-x86_64-windows-0.16.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch tags so the git-describe fallback works

      - name: Install Zig
        shell: bash
        run: |
          curl -fsSL "${{ matrix.zig_url }}" -o "zig${{ matrix.zig_ext }}"
          if [ "${{ matrix.zig_ext }}" = ".zip" ]; then
            7z x -y "zig${{ matrix.zig_ext }}"
          else
            tar -xJf "zig${{ matrix.zig_ext }}"
          fi
          ZIG_DIR="$PWD/${{ matrix.zig_dir }}"
          # Git Bash on Windows reports MSYS paths (/c/...); convert to a
          # Windows path (C:\...) so the PATH entry is usable by the runner.
          if command -v cygpath >/dev/null 2>&1; then
            ZIG_DIR="$(cygpath -w "$ZIG_DIR")"
          fi
          printf '%s\n' "$ZIG_DIR" >> "$GITHUB_PATH"

      - name: Apply vaxis NOVA-LOCAL-PATCH (focus-handler guards)
        shell: bash
        run: |
          # Fresh CI checkouts fetch a PRISTINE vaxis into zig-pkg/; the
          # configure-time guard in build.zig then fails the first invocation
          # on purpose (an unpatched binary SIGSEGVs on session switch — see
          # AGENTS.md "vxfw FocusHandler crash"). Tolerate that first
          # failure, apply the checked-in patch, and let the build step run
          # against the guarded copy.
          zig build --fetch -Dtarget=${{ matrix.target }} || true
          for d in zig-pkg/vaxis-0.6.0-*/; do
            patch -p1 -d "$d" < tools/vendor-patches/vaxis-focus-handler.patch
            test "$(grep -c NOVA-LOCAL-PATCH "$d/src/vxfw/App.zig")" -eq 2
          done

      - name: Build (ReleaseFast)
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: zig build install -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast -Dversion="$VERSION" --prefix dist

      - name: Rename binary
        shell: bash
        run: mv dist/bin/${{ matrix.bin }} dist/${{ matrix.artifact }}

      - name: Checksum
        shell: bash
        run: |
          cd dist
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Determine pre-release
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.prerelease.outputs.value }}
          files: dist/*
          generate_release_notes: true

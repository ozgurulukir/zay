name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: zay-linux-x86_64
            bin: zay
            target_arg: -Dtarget=x86_64-linux-musl
            zig_url: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            zig_ext: .tar.xz
            zig_dir: zig-x86_64-linux-0.16.0
          - os: windows-latest
            artifact: zay-windows-x86_64.exe
            bin: zay.exe
            target_arg: -Dtarget=x86_64-windows
            zig_url: https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip
            zig_ext: .zip
            zig_dir: zig-x86_64-windows-0.16.0
          # No -Dtarget: the runner IS aarch64-macos, and an explicit target
          # flag makes Zig treat the build as a cross-compile and skip native
          # SDK detection ("unable to find framework 'Security'").
          - os: macos-latest
            artifact: zay-macos-aarch64
            bin: zay
            target_arg: ""
            zig_url: https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz
            zig_ext: .tar.xz
            zig_dir: zig-aarch64-macos-0.16.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # fetch tags so the git-describe fallback works

      - name: Install Zig
        shell: bash
        run: |
          curl -fsSL "${{ matrix.zig_url }}" -o "zig${{ matrix.zig_ext }}"
          if [ "${{ matrix.zig_ext }}" = ".zip" ]; then
            7z x -y "zig${{ matrix.zig_ext }}"
          else
            tar -xJf "zig${{ matrix.zig_ext }}"
          fi
          ZIG_DIR="$PWD/${{ matrix.zig_dir }}"
          # Git Bash on Windows reports MSYS paths (/c/...); convert to a
          # Windows path (C:\...) so the PATH entry is usable by the runner.
          if command -v cygpath >/dev/null 2>&1; then
            ZIG_DIR="$(cygpath -w "$ZIG_DIR")"
          fi
          printf '%s\n' "$ZIG_DIR" >> "$GITHUB_PATH"

      - name: Apply vaxis ZAY-LOCAL-PATCH (focus-handler guards)
        shell: bash
        run: |
          # Fresh CI checkouts fetch a PRISTINE vaxis into zig-pkg/; the
          # configure-time guard in build.zig then fails the first invocation
          # on purpose (an unpatched binary SIGSEGVs on session switch — see
          # AGENTS.md "vxfw FocusHandler crash"). Tolerate that first
          # failure, apply the checked-in patch, and let the build step run
          # against the guarded copy.
          zig build --fetch ${{ matrix.target_arg }} || true
          for d in zig-pkg/vaxis-0.6.0-*/; do
            patch -p1 -d "$d" < tools/vendor-patches/vaxis-focus-handler.patch
            test "$(grep -c ZAY-LOCAL-PATCH "$d/src/vxfw/App.zig")" -eq 2
          done

      - name: Build (ReleaseFast)
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: zig build install ${{ matrix.target_arg }} -Doptimize=ReleaseFast -Dversion="$VERSION" --prefix dist

      # Real runtime validation on the target OS (the Windows binary is not
      # runnable from the bash shell, so it is build-only).
      - name: Runtime smoke
        if: runner.os != 'Windows'
        shell: bash
        run: dist/bin/${{ matrix.bin }} --version

      - name: Rename binary
        shell: bash
        run: mv dist/bin/${{ matrix.bin }} dist/${{ matrix.artifact }}

      # The Linux ELF embeds ~24 MB of DWARF (PE ships debug in a sidecar
      # .pdb; this MachO build omits it entirely) — split it out so the
      # released binary matches the other platforms in size and stays
      # symbol-izable: the .debug sidecar rides along as a release asset
      # and is found via the .gnu_debuglink CRC stored in the stripped
      # binary (distro-style keep-debug + strip + debuglink).
      - name: Split debug info (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          objcopy --only-keep-debug dist/${{ matrix.artifact }} dist/${{ matrix.artifact }}.debug
          strip --strip-debug dist/${{ matrix.artifact }}
          objcopy --add-gnu-debuglink=dist/${{ matrix.artifact }}.debug dist/${{ matrix.artifact }}
          sha256sum dist/${{ matrix.artifact }}.debug > dist/${{ matrix.artifact }}.debug.sha256

      - name: Checksum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          else
            shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Determine pre-release
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.prerelease.outputs.value }}
          files: dist/*
          generate_release_notes: true

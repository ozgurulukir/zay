[project]
name = "zay-db-server"
version = "0.1.0"
description = "Standalone external database server and service for Zay Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0",
]

[project.scripts]
zay-db-server = "tools.db_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

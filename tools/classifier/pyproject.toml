[project]
name = "zay-classifier"
version = "0.1.0"
description = "Standalone command safety classifier service for Zay Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.19.0",
    "transformers>=4.45.0",
    "tokenizers>=0.20.0",
    "huggingface-hub>=0.25.0",
    "httpx>=0.27.0",
]

[project.scripts]
zay-classifier = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
